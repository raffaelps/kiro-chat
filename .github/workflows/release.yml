# Ao enviar uma tag vX.Y.Z (scripts/release.sh), compila o app universal e publica a release
# com o KiroChat.zip e o checksum. O app instalado procura essa release para se atualizar.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conferir versão
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "VERSION ($VERSION) não bate com a tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Testes
        run: swift test

      - name: Compilar
        run: scripts/build-app.sh --universal --zip

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/KiroChat.zip dist/KiroChat.zip.sha256 \
            --title "Kiro Chat ${GITHUB_REF_NAME#v}" --generate-notes
